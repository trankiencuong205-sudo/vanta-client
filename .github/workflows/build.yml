    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project from ZIP
        run: |
          unzip -oq vanta-client-project.zip
          cp -a vanta/. .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
